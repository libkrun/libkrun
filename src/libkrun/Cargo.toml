[package]
name = "libkrun"
version = "2.0.0-dev"
authors = ["The libkrun Authors"]
edition = "2024"
description = "A dynamic library providing Virtualization-based process isolation capabilities"
build = "build.rs"
license = "Apache-2.0"
repository = "https://github.com/containers/libkrun"

[features]
tee = ["devices/tee", "arch/tee"]
amd-sev = ["blk", "bitfield", "bitflags", "iocuddle", "tee", "kbs-types", "serde", "serde_json", "devices/amd-sev", "arch/amd-sev"]
tdx = ["blk", "tee", "kbs-types", "serde", "serde_json", "dep:tdx", "devices/tdx", "arch/tdx", "cpuid/tdx"]
net = ["devices/net"]
blk = ["devices/blk"]
gpu = ["devices/gpu", "krun_display"]
input = ["krun_input", "devices/input"]
virgl_resource_map2 = ["devices/virgl_resource_map2"]
aws-nitro = ["devices/aws-nitro", "dep:aws-nitro", "dep:nitro-enclaves"]
vhost-user = ["devices/vhost-user", "krun_display"]
timesync = ["devices/timesync"]

[dependencies]
bitfield = { version = "0.19.4", optional = true }
bitflags = { version = "2.10.0", optional = true }
crossbeam-channel = ">=0.5.15"
env_logger = "0.11"
flate2 = "1.0.35"
iocuddle = { version = "0.1.1", optional = true }
kbs-types = { version = "0.13.0", optional = true }
libc = ">=0.2.39"
libloading = "0.8"
linux-loader = { version = "0.14.0", features = ["bzimage", "elf", "pe"] }
log = "0.4.0"
once_cell = "1.4.1"
serde = { version = "1.0.125", optional = true }
serde_json = { version = "1.0.64", optional = true }
vm-memory = { version = "0.18.0", default-features = false, features = ["backend-mmap"] }
vmm-sys-util = "0.15"
krun_display = { package = "krun-display", version = "0.1.0", path = "../display", optional = true, features = ["bindgen_clang_runtime"] }
krun_input = { package = "krun-input", version = "0.1.0", path = "../input", optional = true, features = ["bindgen_clang_runtime"] }

arch = { package = "krun-arch", version = "=0.1.0-2.0.0-dev", path = "../arch" }
arch_gen = { package = "krun-arch-gen", version = "=0.1.0-2.0.0-dev", path = "../arch_gen" }
devices = { package = "krun-devices", version = "=0.1.0-2.0.0-dev", path = "../devices" }
kernel = { package = "krun-kernel", version = "=0.1.0-2.0.0-dev", path = "../kernel" }
polly = { package = "krun-polly", version = "=0.1.0-2.0.0-dev", path = "../polly" }
utils = { package = "krun-utils", version = "=0.1.0-2.0.0-dev", path = "../utils" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
bzip2 = "0.5"
cpuid = { package = "krun-cpuid", version = "=0.1.0-2.0.0-dev", path = "../cpuid" }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["fs", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
hvf = { package = "krun-hvf", version = "=0.1.0-2.0.0-dev", path = "../hvf" }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { version = "0.14.1", features = ["fam-wrappers"] }
kvm-ioctls = "0.25"
aws-nitro = { package = "krun-aws-nitro", version = "=0.1.0-2.0.0-dev", path = "../aws_nitro", optional = true }
nitro-enclaves = { version = "0.5.0", optional = true }
tdx = { version = "0.1.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
devices = { package = "krun-devices", version = "=0.1.0-2.0.0-dev", path = "../devices", features = ["test_utils"] }

[lib]
name = "krun"
crate-type = ["cdylib", "lib"]
