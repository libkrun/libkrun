[package]
name = "test_cases"
edition = "2024"

[features]
host = ["krun-sys", "krun-init-blob-via-cdylib", "serde", "serde_json"]
guest = []

[lib]
name = "test_cases"

[dependencies]
krun-sys = { path = "../../krun-sys", optional = true }
krun-init-blob-via-cdylib = { path = "../../init/init-blob-via-cdylib", optional = true }
macros = { path = "../macros" }
nix = { version = "0.29.0", features = ["fs", "socket", "ioctl", "user"] }
anyhow = "1.0.95"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
