name: 'Setup Build Environment'
description: 'Common setup for Rust builds with all required packages (Linux & macOS)'
runs:
  using: 'composite'
  steps:
    - name: Install Rust toolchain
      shell: bash
      run: |
        rustup update stable
        rustup default stable
        rustup component add rustfmt clippy
        rustup target add x86_64-unknown-freebsd
        rustup toolchain install nightly
        rustup component add rust-src --toolchain nightly

    - name: Add musl target
      shell: bash
      run: |
        case $(uname -m) in
          x86_64)  TARGET="x86_64-unknown-linux-musl"  ;;
          aarch64|arm64) TARGET="aarch64-unknown-linux-musl" ;;
          *)       echo "unknown arch: $(uname -m)"; exit 1 ;;
        esac
        rustup target add "$TARGET"

    - name: Cache Cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Set up Homebrew (macOS)
      if: runner.os == 'macOS'
      uses: Homebrew/actions/setup-homebrew@master

    - name: Install packages (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew tap libkrun/krun && brew trust libkrun/krun && brew install clang-format llvm meson ninja libepoxy

    - name: Build and install virglrenderer 1.3.0 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        python3 -m venv /tmp/venv
        source /tmp/venv/bin/activate
        pip install PyYAML
        rm -rf /tmp/virglrenderer
        git clone --depth 1 --branch virglrenderer-1.3.0 \
          https://gitlab.freedesktop.org/virgl/virglrenderer.git /tmp/virglrenderer
        cd /tmp/virglrenderer
        meson setup build
        ninja -C build
        sudo ninja -C build install

    - name: Install packages (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          libepoxy-dev \
          libdrm-dev \
          clang-format \
          libclang-dev \
          meson \
          ninja-build \
          python3-yaml

    - name: Build and install virglrenderer 1.3.0 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        rm -rf /tmp/virglrenderer
        git clone --depth 1 --branch virglrenderer-1.3.0 \
          https://gitlab.freedesktop.org/virgl/virglrenderer.git /tmp/virglrenderer
        cd /tmp/virglrenderer
        meson setup build
        ninja -C build
        sudo ninja -C build install
        sudo ldconfig
