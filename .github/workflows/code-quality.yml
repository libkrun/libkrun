name: Code Quality
on: [pull_request]

jobs:
  code-quality-linux-x86_64:
    name: libkrun (Linux x86_64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (amd-sev)
        run: cargo clippy --locked --features amd-sev -- -D warnings
      
      - name: Clippy (tdx)
        run: cargo clippy --locked --features tdx -- -D warnings
      
      - name: Clippy (net+blk+gpu+input)
        run: cargo clippy --locked --features net,blk,gpu,input -- -D warnings
      
      - name: Clippy (aws-nitro+net)
        run: cargo clippy --locked --features aws-nitro,net -- -D warnings

  code-quality-linux-aarch64:
    name: libkrun (Linux aarch64)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (default)
        run: cargo clippy --locked -- -D warnings
      
      - name: Clippy (net+blk+gpu+input)
        run: cargo clippy --locked --features net,blk,gpu,input -- -D warnings

  code-quality-macos:
    name: libkrun (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Clippy (gpu)
        run: cargo clippy --locked --features gpu -- -D warnings
        env:
          KRUN_INIT_BINARY_PATH: ${{ github.workspace }}/init/init

  verify-init-blob-bindings:
    name: init-blob bindings
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Install ffier-gen-c-header
        run: cargo install --git https://github.com/mtjhrc/ffier.git --rev 289162e ffier-gen-c-header

      - name: Regenerate init-blob bindings
        run: make gen-init-blob-bindings

      - name: Verify init-blob JSON schema is up to date
        run: |
          git diff --exit-code init/init-blob-via-cdylib/ffier-krun_init.json \
            || { echo "error: init-blob JSON schema is out of date — run 'make gen-init-blob-bindings' and commit the result"; exit 1; }

      - name: Verify init-blob C header is up to date
        run: |
          git diff --exit-code include/libkrun_init.h \
            || { echo "error: init-blob C header is out of date — run 'make gen-init-blob-bindings' and commit the result"; exit 1; }

  code-quality-examples:
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: "Examples (Linux x86_64)"
            runner: ubuntu-26.04
          
          - name: "Examples (Linux aarch64)"
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Install GTK system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yqq --no-install-recommends \
            libgtk-4-dev
      
      - name: Build and install libkrun to local prefix
        run: |
          mkdir -p $HOME/libkrun-prefix
          GPU=1 NET=1 INPUT=1 PREFIX=$HOME/libkrun-prefix make && PREFIX=$HOME/libkrun-prefix make install
      
      - name: Clippy (examples workspace)
        run: |
          cd examples
          PKG_CONFIG_PATH="$HOME/libkrun-prefix/lib64/pkgconfig:$PKG_CONFIG_PATH" LD_LIBRARY_PATH="$HOME/libkrun-prefix/lib64:$LD_LIBRARY_PATH" cargo clippy --locked -- -D warnings
