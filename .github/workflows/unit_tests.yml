name: Unit tests
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-macos:
    name: Unit tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Test macOS event registration
        run: cargo test --locked -p krun-utils macos::epoll::tests

      - name: Test macOS filesystem metadata and cached handles
        run: cargo test --locked -p krun-devices --features net,blk --lib virtio::fs::macos

      # Hosted macOS runners do not support nested virtualization. Compile the
      # hardware regression here; run it explicitly on a physical Mac with:
      # cargo test --locked -p krun-hvf simd_restore_tests::restored_simd_registers_keep_every_bit -- --ignored --exact
      - name: Test HVF helpers and compile the hardware restore regression
        run: cargo test --locked -p krun-hvf

  unit-tests-linux-x86_64:
    name: Unit tests (Linux x86_64)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup build environment
        uses: ./.github/actions/setup-build-env
      
      - name: Create a fake init
        run: touch init/init
      
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo usermod -a -G kvm $USER

      - name: Unit tests
        run: cargo test

  unit-tests-linux-aarch64:
    name: Unit tests (Linux aarch64)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-build-env

      - name: Create a fake init
        run: touch init/init

      - name: Unit tests
        run: cargo test
